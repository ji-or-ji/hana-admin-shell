<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理员通道</title>
  <link rel="stylesheet" href="./assets/panel.css">
</head>
<body>
  <main>
    <header class="head">
      <span class="dot" id="dot" data-state="idle"></span>
      <div class="headText">
        <div class="title" id="title">正在读通道状态…</div>
        <div class="sub" id="sub"></div>
      </div>
      <button class="ghost" id="refresh" title="重新读一次">刷新</button>
    </header>

    <section class="block">
      <div class="blockTitle">握着窗口的会话</div>
      <div id="leases" class="rows"><div class="empty">还没有会话开管理员窗口</div></div>
    </section>

    <section class="block">
      <div class="blockTitle">最近跑过的命令</div>
      <div id="audit" class="rows"><div class="empty">暂无记录</div></div>
    </section>

    <footer class="foot" id="foot"></footer>
  </main>
  <script type="module" src="./assets/panel.js"></script>
</body>
</html>
